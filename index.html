<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>تطبيق التفاعل والصور</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #151e27;
      color: #ffffff;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background-color: #212d3b;
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      text-align: center;
      box-sizing: border-box;
    }
    video, img {
      width: 100%;
      max-width: 340px;
      height: auto;
      border-radius: 12px;
      display: none;
      margin: 0 auto 15px auto;
      border: 2px solid #2ea6ff;
      object-fit: cover;
    }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      box-sizing: border-box;
      display: block;
    }
    .btn-main { background-color: #007aff; color: #ffffff; }
    .btn-cam { background-color: #2ea6ff; color: #ffffff; }
    .btn-gallery { background-color: #34c759; color: #ffffff; text-align: center; }
    .step-section { display: none; }
    input[type="file"] { display: none; }
    #status { margin-top: 15px; font-size: 13px; color: #aaaaaa; }
  </style>
</head>
<body>

  <div class="card">
    <!-- المرحلة 1: اختيار الأمر (ظاهرة أولاً) -->
    <div id="step1" class="step-section" style="display: block;">
      <h3 style="margin-top: 0;">اختر الخيار المطلوب</h3>
      <button id="modeStickerBtn" class="btn btn-main">🎨 عمل ملصق (Sticker)</button>
      <button id="modeCompareBtn" class="btn btn-main" style="background-color: #ff9500;">🔍 مقارنة بين صورتين</button>
    </div>

    <!-- المرحلة 2: التقاط أو اختيار الصورة -->
    <div id="step2" class="step-section">
      <h3 id="step2Title">التقط أو اختر الصورة</h3>

      <video id="video" autoplay playsinline muted></video>
      <img id="preview" alt="معاينة الصورة" />

      <div id="captureControls">
        <button id="startCamBtn" class="btn btn-cam">📸 فتح الكاميرا المباشرة</button>
        <button id="takeSnapBtn" class="btn btn-cam" style="display:none; background-color: #e63946;">⚡ التقاط الصورة الآن</button>
        <label for="galleryInput" class="btn btn-gallery">🖼️ اختيار من معرض الصور</label>
        <input type="file" id="galleryInput" accept="image/*">
      </div>
    </div>

    <p id="status">يرجى اختيار أحد الخيارين أعلاه للمتابعة</p>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // العناصر
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step2Title = document.getElementById('step2Title');
    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const canvas = document.getElementById('canvas');

    const modeStickerBtn = document.getElementById('modeStickerBtn');
    const modeCompareBtn = document.getElementById('modeCompareBtn');

    const startCamBtn = document.getElementById('startCamBtn');
    const takeSnapBtn = document.getElementById('takeSnapBtn');
    const galleryInput = document.getElementById('galleryInput');
    const status = document.getElementById('status');

    let selectedMode = ""; // "sticker" or "compare"
    let collectedImages = [];
    let currentStream = null;

    // --- اختيار الوضع: ملصق ---
    modeStickerBtn.addEventListener('click', () => {
      selectedMode = "sticker";
      step1.style.display = "none";
      step2.style.display = "block";
      step2Title.innerText = "اختر صورة لتحويلها إلى ملصق";
      status.innerText = "التقط صورة أو اختر من المعرض";
    });

    // --- اختيار الوضع: مقارنة ---
    modeCompareBtn.addEventListener('click', () => {
      selectedMode = "compare";
      step1.style.display = "none";
      step2.style.display = "block";
      step2Title.innerText = "اختر الصورة الأولى للمقارنة";
      status.innerText = "يرجى تحديد الصورة الأولى (1 من 2)";
    });

    // --- فتح الكاميرا ---
    startCamBtn.addEventListener('click', async () => {
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = currentStream;
        video.style.display = 'block';
        preview.style.display = 'none';
        startCamBtn.style.display = 'none';
        takeSnapBtn.style.display = 'block';
        status.innerText = "وجه الكاميرا واضغط التقاط.";
      } catch (err) {
        alert("تعذر الوصول للكاميرا: " + err);
      }
    });

    // --- التقاط من الكاميرا ---
    takeSnapBtn.addEventListener('click', () => {
      const w = video.videoWidth || 640;
      const h = video.videoHeight || 480;
      const maxDim = 600;
      let targetW = w, targetH = h;

      if (w > h) {
        if (w > maxDim) { targetH = Math.round(h * (maxDim / w)); targetW = maxDim; }
      } else {
        if (h > maxDim) { targetW = Math.round(w * (maxDim / h)); targetH = maxDim; }
      }

      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, targetW, targetH);

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      video.style.display = 'none';
      takeSnapBtn.style.display = 'none';
      startCamBtn.style.display = 'block';

      const base64Img = canvas.toDataURL('image/jpeg', 0.5);
      handleImageCaptured(base64Img);
    });

    // --- اختيار من المعرض ---
    galleryInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 600;
            let w = img.width, h = img.height;
            if (w > h) {
              if (w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
            } else {
              if (h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
            }

            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            const base64Img = canvas.toDataURL('image/jpeg', 0.5);
            handleImageCaptured(base64Img);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // --- معالجة التقاط/تحديد الصورة بناءً على الوضع ---
    function handleImageCaptured(base64Img) {
      collectedImages.push(base64Img);

      // إصلاح: عرض معاينة الصورة الملتقطة/المختارة للمستخدم
      video.style.display = 'none';
      preview.src = base64Img;
      preview.style.display = 'block';

      if (selectedMode === "sticker") {
        status.innerText = "جاري النشر في القناة وإرسال الملصق...";
        tg.sendData(JSON.stringify({
          action: "sticker",
          images: collectedImages
        }));
        tg.close();
      }
      else if (selectedMode === "compare") {
        if (collectedImages.length === 1) {
          // تم جمع الصورة الأولى، يطلب الصورة الثانية
          step2Title.innerText = "اختر الصورة الثانية للمقارنة";
          status.innerText = "تم اختيار الأولى بنجاح! التقط/اختر الصورة الثانية (2 من 2)";
          galleryInput.value = ""; // إعادة ضبط حقل اختيار الملف
        } else if (collectedImages.length === 2) {
          // تم جمع الصورتين
          status.innerText = "جاري النشر وحساب نسبة المقارنة...";
          tg.sendData(JSON.stringify({
            action: "compare",
            images: collectedImages
          }));
          tg.close();
        }
      }
    }
  </script>
</body>
</html>
