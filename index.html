<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الصور والتفاعلات</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #151e27;
      color: #ffffff;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #212d3b;
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    video, img {
      width: 100%;
      max-width: 340px;
      border-radius: 12px;
      display: none;
      margin-bottom: 15px;
      border: 2px solid #2ea6ff;
    }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      box-sizing: border-box;
      display: block;
    }
    .btn-cam { background-color: #2ea6ff; color: #fff; }
    .btn-gallery { background-color: #34c759; color: #fff; text-align: center; }
    .btn-direct { background-color: #007aff; color: #fff; }
    .btn-compare { background-color: #ff9500; color: #fff; }
    .options-group { display: none; margin-top: 15px; }
    input[type="file"] { display: none; }
    #status { margin-top: 15px; font-size: 14px; color: #aaa; }
  </style>
</head>
<body>

  <div class="card">
    <h3>اختر أو التقط صورة للمتابعة</h3>

    <video id="video" autoplay playsinline></video>
    <img id="preview" alt="معاينة الصورة" />

    <div id="sourceControls">
      <button id="startCamBtn" class="btn btn-cam">📸 فتح الكاميرا والتقاط صورة</button>
      <label for="galleryInput" class="btn btn-gallery">🖼️ اختيار من معرض الصور</label>
      <input type="file" id="galleryInput" accept="image/*">
    </div>

    <div id="optionsGroup" class="options-group">
      <p style="color: #2ea6ff; font-weight: bold;">اختر نوع النشر الإجراء:</p>
      <button id="sendDirectBtn" class="btn btn-direct">📤 إرسال صورة مباشرة (للبوت )</button>
      <button id="sendCompareBtn" class="btn btn-compare">🔍 إرسال مع نسبة مقارنة (للبوت )</button>
    </div>

    <p id="status">يرجى التقاط صورة أو اختيار ملف من المعرض</p>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const canvas = document.getElementById('canvas');
    const startCamBtn = document.getElementById('startCamBtn');
    const galleryInput = document.getElementById('galleryInput');
    const sourceControls = document.getElementById('sourceControls');
    const optionsGroup = document.getElementById('optionsGroup');
    const sendDirectBtn = document.getElementById('sendDirectBtn');
    const sendCompareBtn = document.getElementById('sendCompareBtn');
    const status = document.getElementById('status');

    let preparedBase64 = "";

    startCamBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;
        video.style.display = 'block';
        preview.style.display = 'none';
        sourceControls.style.display = 'none';
        optionsGroup.style.display = 'block';
        status.innerText = "تم فتح الكاميرا! اختر الإجراء أدناه.";
      } catch (err) {
        alert("تعذر الوصول للكاميرا: " + err);
      }
    });

    galleryInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 600;
            let w = img.width, h = img.height;
            if (w > h) {
              if (w > maxDim) { h *= maxDim / w; w = maxDim; }
            } else {
              if (h > maxDim) { w *= maxDim / h; h = maxDim; }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            preparedBase64 = canvas.toDataURL('image/jpeg', 0.6);

            preview.src = preparedBase64;
            preview.style.display = 'block';
            video.style.display = 'none';
            sourceControls.style.display = 'none';
            optionsGroup.style.display = 'block';
            status.innerText = "تم تجهيز الصورة بنجاح! اختر الإجراء المطلوب.";
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function getFinalImage() {
      if (video.style.display === 'block') {
        const maxDim = 600;
        let w = video.videoWidth || 480;
        let h = video.videoHeight || 640;
        if (w > h) {
          if (w > maxDim) { h *= maxDim / w; w = maxDim; }
        } else {
          if (h > maxDim) { w *= maxDim / h; h = maxDim; }
        }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, w, h);
        return canvas.toDataURL('image/jpeg', 0.6);
      }
      return preparedBase64;
    }

    sendDirectBtn.addEventListener('click', () => {
      const imgData = getFinalImage();
      if (imgData) {
        status.innerText = "جاري الإرسال للبوت ...";
        tg.sendData(JSON.stringify({ action: "photo_direct", image: imgData }));
        tg.close();
      } else {
        alert("يرجى التقاط أو اختيار صورة أولاً.");
      }
    });

    sendCompareBtn.addEventListener('click', () => {
      const imgData = getFinalImage();
      if (imgData) {
        status.innerText = "جاري الحساب والنشر في البوت ...";
        tg.sendData(JSON.stringify({ action: "photo_compare", image: imgData }));
        tg.close();
      } else {
        alert("يرجى التقاط أو اختيار صورة أولاً.");
      }
    });
  </script>
</body>
</html>
