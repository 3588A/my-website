<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Telegram Image Tool</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #f2f2f2);
            color: var(--tg-theme-text-color, #222);
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 25px;
        }

        .mode-container {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .mode-button {
            flex: 1;
            border: none;
            border-radius: 15px;
            padding: 18px 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: var(--tg-theme-secondary-bg-color, #e8e8e8);
            color: var(--tg-theme-text-color, #222);
            transition: 0.2s;
        }

        .mode-button.active {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
        }

        .upload-box {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .upload-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .upload-description {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .upload-button {
            flex: 1;
            border: none;
            border-radius: 14px;
            padding: 16px 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
        }

        .upload-button:active {
            transform: scale(0.97);
        }

        input[type="file"] {
            display: none;
        }

        .preview-container {
            display: none;
            margin-top: 20px;
        }

        .preview-container.show {
            display: block;
        }

        .preview-title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .preview-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background: #ddd;
            aspect-ratio: 1 / 1;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .preview-number {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .status {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 14px;
            border-radius: 12px;
            background: var(--tg-theme-secondary-bg-color, #eee);
            font-size: 14px;
        }

        .status.show {
            display: block;
        }

        .status.error {
            color: #d93025;
        }

        .status.success {
            color: #188038;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 4px solid #ddd;
            border-top: 4px solid var(--tg-theme-button-color, #2481cc);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .info {
            text-align: center;
            font-size: 12px;
            opacity: 0.6;
            margin-top: 20px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="title">
        🖼️ أدوات الصور
    </div>

    <div class="subtitle">
        إنشاء ملصق أو مقارنة صورتين أو تقييم جمالك
    </div>

    <!-- Modes -->

    <div class="mode-container">

        <button
            class="mode-button active"
            id="stickerMode"
            onclick="selectMode('sticker')"
        >
            🎨 إنشاء ملصق
        </button>

        <button
            class="mode-button"
            id="compareMode"
            onclick="selectMode('compare')"
        >
            🔍 مقارنة
        </button>

        <button
            class="mode-button"
            id="beautyMode"
            onclick="selectMode('beauty')"
        >
            ✨ تقييم جمالك
        </button>

    </div>

    <!-- Upload -->

    <div class="upload-box">

        <div
            class="upload-title"
            id="uploadTitle"
        >
            🎨 إنشاء ملصق
        </div>

        <div
            class="upload-description"
            id="uploadDescription"
        >
            اختر صورة واحدة لإنشاء ملصق
        </div>

        <div class="buttons">

            <!-- Camera -->

            <button
                class="upload-button"
                onclick="openCamera()"
            >
                📷 الكاميرا
            </button>

            <!-- Gallery -->

            <button
                class="upload-button"
                onclick="openGallery()"
            >
                🖼️ المعرض
            </button>

        </div>

        <!-- Gallery input -->

        <input
            type="file"
            id="galleryInput"
            accept="image/*"
            onchange="handleGallery(event)"
        >

        <!-- Camera input -->

        <input
            type="file"
            id="cameraInput"
            accept="image/*"
            capture="environment"
            onchange="handleCamera(event)"
        >

    </div>

    <!-- Preview -->

    <div
        class="preview-container"
        id="previewContainer"
    >

        <div class="preview-title">
            الصور المختارة
        </div>

        <div
            class="preview-grid"
            id="previewGrid"
        ></div>

    </div>

    <!-- Loading -->

    <div
        class="loading"
        id="loading"
    >

        <div class="spinner"></div>

        <div style="margin-top:10px;" id="loadingText">
            جاري معالجة الصورة...
        </div>

    </div>

    <!-- Status -->

    <div
        class="status"
        id="status"
    ></div>

    <div class="info">
        سيتم إرسال الصور والنتائج بعد إتمام المعالجة.
    </div>

</div>


<script>

    // =========================================================
    // Telegram
    // =========================================================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // =========================================================
    // Variables
    // =========================================================

    let selectedMode = "sticker";

    let collectedImages = [];

    let currentStream = null;


    // =========================================================
    // Select Mode
    // =========================================================

    function selectMode(mode) {

        selectedMode = mode;

        collectedImages = [];

        document
            .getElementById("previewGrid")
            .innerHTML = "";

        document
            .getElementById("previewContainer")
            .classList.remove("show");

        document
            .getElementById("status")
            .classList.remove("show");

        const stickerMode =
            document.getElementById("stickerMode");

        const compareMode =
            document.getElementById("compareMode");

        const beautyMode =
            document.getElementById("beautyMode");

        const uploadTitle =
            document.getElementById("uploadTitle");

        const uploadDescription =
            document.getElementById("uploadDescription");


        if (mode === "sticker") {

            stickerMode.classList.add("active");
            compareMode.classList.remove("active");
            beautyMode.classList.remove("active");

            uploadTitle.innerText =
                "🎨 إنشاء ملصق";

            uploadDescription.innerText =
                "اختر صورة واحدة لإنشاء ملصق";

        } else if (mode === "compare") {

            stickerMode.classList.remove("active");
            compareMode.classList.add("active");
            beautyMode.classList.remove("active");

            uploadTitle.innerText =
                "🔍 مقارنة صورتين";

            uploadDescription.innerText =
                "اختر صورتين لمقارنتهما";

        } else {

            stickerMode.classList.remove("active");
            compareMode.classList.remove("active");
            beautyMode.classList.add("active");

            uploadTitle.innerText =
                "✨ تقييم جمالك";

            uploadDescription.innerText =
                " اختر صورة واحدة للحصول على تقييم لجمالك ";

        }

    }


    // =========================================================
    // Open Gallery
    // =========================================================

    function openGallery() {

        const input =
            document.getElementById("galleryInput");

        if (
            selectedMode === "sticker" ||
            selectedMode === "beauty"
        ) {

            input.multiple = false;

        } else {

            input.multiple = true;

        }

        input.value = "";

        input.click();
    }


    // =========================================================
    // Open Camera
    // =========================================================

    function openCamera() {

        const input =
            document.getElementById("cameraInput");

        input.value = "";

        input.click();
    }


    // =========================================================
    // Gallery Handler
    // =========================================================

    async function handleGallery(event) {

        const files =
            Array.from(event.target.files || []);

        if (!files.length) {
            return;
        }


        if (
            selectedMode === "sticker" ||
            selectedMode === "beauty"
        ) {

            if (files.length > 0) {

                collectedImages = [];

                const base64 =
                    await resizeImage(files[0]);

                collectedImages.push(base64);

                updatePreview();

                await sendImages();

            }

            return;
        }


        // Compare

        if (files.length > 2) {

            showStatus(
                "❌ للمقارنة اختر صورتين فقط",
                "error"
            );

            return;
        }


        for (const file of files) {

            if (collectedImages.length >= 2) {
                break;
            }

            const base64 =
                await resizeImage(file);

            collectedImages.push(base64);
        }


        updatePreview();


        if (collectedImages.length === 2) {

            await sendImages();

        } else {

            showStatus(
                "📸 اختر الصورة الثانية",
                ""
            );

        }

    }


    // =========================================================
    // Camera Handler
    // =========================================================

    async function handleCamera(event) {

        const file =
            event.target.files?.[0];

        if (!file) {
            return;
        }


        if (
            selectedMode === "sticker" ||
            selectedMode === "beauty"
        ) {

            collectedImages = [];

        }


        if (
            selectedMode === "compare" &&
            collectedImages.length >= 2
        ) {

            showStatus(
                "❌ تم اختيار صورتين بالفعل",
                "error"
            );

            return;
        }


        const base64 =
            await resizeImage(file);

        collectedImages.push(base64);

        updatePreview();


        if (
            selectedMode === "sticker" ||
            selectedMode === "beauty"
        ) {

            await sendImages();

        } else {

            if (collectedImages.length === 2) {

                await sendImages();

            } else {

                showStatus(
                    "📸 اختر الصورة الثانية",
                    ""
                );

            }

        }

    }


    // =========================================================
    // Resize Image
    // =========================================================

    function resizeImage(file) {

        return new Promise((resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload = function(e) {

                const img =
                    new Image();


                img.onload = function() {

                    const maxSize = 900;

                    let width =
                        img.width;

                    let height =
                        img.height;


                    if (width > maxSize ||
                        height > maxSize) {

                        if (width > height) {

                            height =
                                height *
                                (maxSize / width);

                            width =
                                maxSize;

                        } else {

                            width =
                                width *
                                (maxSize / height);

                            height =
                                maxSize;

                        }

                    }


                    const canvas =
                        document.createElement("canvas");

                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext("2d");


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    const result =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.75
                        );


                    resolve(result);

                };


                img.onerror = function() {

                    reject(
                        new Error(
                            "تعذر قراءة الصورة"
                        )
                    );

                };


                img.src = e.target.result;

            };


            reader.onerror = function() {

                reject(
                    new Error(
                        "تعذر قراءة الملف"
                    )
                );

            };


            reader.readAsDataURL(file);

        });

    }


    // =========================================================
    // Update Preview
    // =========================================================

    function updatePreview() {

        const container =
            document.getElementById(
                "previewContainer"
            );

        const grid =
            document.getElementById(
                "previewGrid"
            );


        grid.innerHTML = "";


        if (collectedImages.length === 0) {

            container.classList.remove("show");

            return;
        }


        container.classList.add("show");


        collectedImages.forEach(
            (image, index) => {

                const item =
                    document.createElement("div");

                item.className =
                    "preview-item";


                const img =
                    document.createElement("img");

                img.src = image;


                const number =
                    document.createElement("div");

                number.className =
                    "preview-number";

                number.innerText =
                    index + 1;


                item.appendChild(img);
                item.appendChild(number);

                grid.appendChild(item);

            }
        );

    }


    // =========================================================
    // Send Images To FastAPI
    // =========================================================

    async function sendImages() {

        if (collectedImages.length === 0) {

            return;
        }


        if (
            (
                selectedMode === "sticker" ||
                selectedMode === "beauty"
            ) &&
            collectedImages.length !== 1
        ) {

            return;
        }


        if (
            selectedMode === "compare" &&
            collectedImages.length !== 2
        ) {

            return;
        }


        showLoading(true);

        hideStatus();


        try {

            const formData =
                new FormData();


            // Action

            formData.append(
                "action",
                selectedMode
            );

            formData.append(
                "initData",
                tg.initData
            );


            // Convert Base64 → Blob

            for (
                let i = 0;
                i < collectedImages.length;
                i++
            ) {

                const base64 =
                    collectedImages[i];


                const response =
                    await fetch(base64);


                const blob =
                    await response.blob();


                formData.append(
                    "images",
                    blob,
                    `image_${i + 1}.jpg`
                );

            }


            // Send to FastAPI

            const response =
                await fetch(
                    "https://my-website.fastapicloud.dev/process",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            let result;


            try {

                result =
                    await response.json();

            } catch {

                throw new Error(
                    "الخادم أرسل استجابة غير صحيحة"
                );

            }


            if (!response.ok) {

                throw new Error(
                    result.detail ||
                    "حدث خطأ في الخادم"
                );

            }


            // Success

            showStatus(
                result.message ||
                "✅ تمت العملية بنجاح",
                "success"
            );


            showLoading(false);


            // Close Telegram after short delay

            setTimeout(() => {

                tg.close();

            }, 1500);


        } catch (error) {

            console.error(
                "Upload error:",
                error
            );


            showLoading(false);


            showStatus(
                "❌ حدث خطأ:\n" +
                error.message,
                "error"
            );

        }

    }


    // =========================================================
    // Loading
    // =========================================================

    function showLoading(show) {

        const loading =
            document.getElementById(
                "loading"
            );


        if (show) {

            loading.classList.add("show");

        } else {

            loading.classList.remove("show");

        }

    }


    // =========================================================
    // Status
    // =========================================================

    function showStatus(message, type) {

        const status =
            document.getElementById(
                "status"
            );


        status.innerText =
            message;


        status.className =
            "status show";


        if (type) {

            status.classList.add(type);

        }

    }


    function hideStatus() {

        const status =
            document.getElementById(
                "status"
            );


        status.classList.remove(
            "show"
        );

    }


    // =========================================================
    // Prevent accidental Telegram closing
    // =========================================================

    window.addEventListener(
        "beforeunload",
        function() {

            if (currentStream) {

                currentStream
                    .getTracks()
                    .forEach(
                        track => track.stop()
                    );

            }

        }
    );

</script>

</body>
</html>
