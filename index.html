<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Photo Tools</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0e1621);
      --card: var(--tg-theme-secondary-bg-color, #17212b);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #8b98a5);
      --button: var(--tg-theme-button-color, #2ea6ff);
      --button-text: var(--tg-theme-button-text-color, #ffffff);

      --green: #20c997;
      --orange: #ff9f43;
      --red: #ff5c5c;
      --border: rgba(255,255,255,0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(
          circle at top,
          rgba(46,166,255,0.15),
          transparent 38%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 18px 14px 30px;
    }

    .app {
      width: 100%;
      max-width: 440px;
    }

    /* Header */

    .header {
      text-align: center;
      margin: 8px 0 18px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      background: linear-gradient(135deg, #2ea6ff, #6c5ce7);
      box-shadow: 0 10px 30px rgba(46,166,255,0.25);
    }

    .header h1 {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
    }

    .header p {
      margin: 7px 0 0;
      color: var(--hint);
      font-size: 13px;
      line-height: 1.6;
    }

    /* Card */

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    /* Progress */

    .progress {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 20px;
    }

    .progress-step {
      height: 5px;
      flex: 1;
      border-radius: 10px;
      background: rgba(255,255,255,0.09);
      transition: 0.3s;
    }

    .progress-step.active {
      background: var(--button);
    }

    .progress-step.done {
      background: var(--green);
    }

    /* Sections */

    .step {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .step.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .title {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      text-align: center;
    }

    .subtitle {
      margin: 7px 0 18px;
      color: var(--hint);
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }

    /* Mode cards */

    .mode-grid {
      display: grid;
      gap: 12px;
    }

    .mode-btn {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.035);
      color: var(--text);
      border-radius: 17px;
      padding: 16px;
      text-align: right;
      cursor: pointer;
      transition: transform .15s, background .15s, border .15s;
    }

    .mode-btn:active {
      transform: scale(0.98);
    }

    .mode-btn:hover {
      background: rgba(255,255,255,0.06);
    }

    .mode-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 10px;
    }

    .sticker-icon {
      background: rgba(46,166,255,0.15);
    }

    .compare-icon {
      background: rgba(255,159,67,0.15);
    }

    .mode-name {
      display: block;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .mode-desc {
      display: block;
      font-size: 12px;
      color: var(--hint);
      line-height: 1.5;
    }

    /* Media area */

    .media-box {
      position: relative;
      width: 100%;
      min-height: 190px;
      border-radius: 17px;
      background: rgba(0,0,0,0.18);
      border: 1px dashed rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 14px;
    }

    video,
    #preview {
      width: 100%;
      max-height: 330px;
      object-fit: cover;
      display: none;
    }

    video {
      border-radius: 15px;
    }

    #preview {
      border-radius: 15px;
    }

    .media-placeholder {
      text-align: center;
      color: var(--hint);
      padding: 30px 15px;
    }

    .media-placeholder .big-icon {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .media-placeholder div:last-child {
      font-size: 13px;
    }

    /* Buttons */

    .buttons {
      display: grid;
      gap: 10px;
    }

    .btn {
      width: 100%;
      min-height: 49px;
      border: 0;
      border-radius: 13px;
      padding: 13px 15px;
      font-size: 14px;
      font-weight: 800;
      color: var(--button-text);
      cursor: pointer;
      transition: transform .15s, opacity .15s;
      font-family: inherit;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--button);
    }

    .btn-camera {
      background: linear-gradient(135deg, #2ea6ff, #1688d8);
    }

    .btn-gallery {
      background: linear-gradient(135deg, #20c997, #13a67a);
    }

    .btn-danger {
      background: var(--red);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    .btn-orange {
      background: linear-gradient(135deg, #ffb347, #ff8c42);
    }

    input[type="file"] {
      display: none;
    }

    /* Status */

    .status {
      min-height: 20px;
      margin-top: 14px;
      text-align: center;
      color: var(--hint);
      font-size: 12px;
      line-height: 1.5;
    }

    .status.success {
      color: var(--green);
    }

    .status.error {
      color: var(--red);
    }

    /* Back */

    .back-btn {
      border: 0;
      background: transparent;
      color: var(--hint);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      padding: 5px;
      margin-bottom: 8px;
    }

    /* Loading */

    .loading {
      display: none;
      text-align: center;
      padding: 20px 10px;
    }

    .spinner {
      width: 35px;
      height: 35px;
      margin: 0 auto 12px;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: var(--button);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Mobile */

    @media (max-width: 380px) {
      body {
        padding: 12px 10px 25px;
      }

      .card {
        padding: 15px;
        border-radius: 19px;
      }

      .header h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="logo">📸</div>

    <h1>أدوات الصور</h1>

    <p>
      حوّل صورك إلى ملصقات أو قارن بين صورتين بسهولة
    </p>
  </div>

  <div class="card">

    <!-- Progress -->
    <div class="progress">
      <div id="progress1" class="progress-step active"></div>
      <div id="progress2" class="progress-step"></div>
    </div>


    <!-- =========================
         STEP 1
    ========================== -->

    <section id="step1" class="step active">

      <h2 class="title">ماذا تريد أن تفعل؟</h2>

      <p class="subtitle">
        اختر العملية التي تريد تنفيذها على الصور
      </p>

      <div class="mode-grid">

        <button id="modeStickerBtn" class="mode-btn">

          <div class="mode-icon sticker-icon">
            🎨
          </div>

          <span class="mode-name">
            إنشاء ملصق
          </span>

          <span class="mode-desc">
            اختر صورة واحدة وسيتم إرسالها للبوت كملصق
          </span>

        </button>


        <button id="modeCompareBtn" class="mode-btn">

          <div class="mode-icon compare-icon">
            🔍
          </div>

          <span class="mode-name">
            مقارنة صورتين
          </span>

          <span class="mode-desc">
            اختر صورتين لإرسالهم للبوت وإجراء المقارنة
          </span>

        </button>

      </div>

    </section>


    <!-- =========================
         STEP 2
    ========================== -->

    <section id="step2" class="step">

      <button id="backBtn" class="back-btn">
        ← الرجوع
      </button>

      <h2 id="step2Title" class="title">
        اختر صورة
      </h2>

      <p id="step2Subtitle" class="subtitle">
        يمكنك استخدام الكاميرا أو اختيار صورة من المعرض
      </p>


      <!-- Media -->
      <div class="media-box">

        <div id="placeholder" class="media-placeholder">

          <div class="big-icon">
            🖼️
          </div>

          <div>
            لم يتم اختيار صورة بعد
          </div>

        </div>

        <video
          id="video"
          autoplay
          playsinline
          muted>
        </video>

        <img
          id="preview"
          alt="معاينة الصورة">

      </div>


      <!-- Controls -->
      <div id="captureControls" class="buttons">

        <button
          id="startCamBtn"

          📸 فتح الكاميرا

        </button>

</div>


<canvas id="canvas" style="display:none;"></canvas>


<script>

  /* =========================================
     Telegram
  ========================================= */

  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();

    // السماح للتطبيق باستخدام ألوان Telegram
    tg.setHeaderColor("secondary_bg_color");
    tg.setBackgroundColor("bg_color");
  }


  /* =========================================
     Elements
  ========================================= */

  const step1 = document.getElementById("step1");
  const step2 = document.getElementById("step2");

  const progress1 = document.getElementById("progress1");
  const progress2 = document.getElementById("progress2");

  const modeStickerBtn =
    document.getElementById("modeStickerBtn");

  const modeCompareBtn =
    document.getElementById("modeCompareBtn");

  const backBtn =
    document.getElementById("backBtn");

  const step2Title =
    document.getElementById("step2Title");

  const step2Subtitle =
    document.getElementById("step2Subtitle");

  const video =
    document.getElementById("video");

  const preview =
    document.getElementById("preview");

  const canvas =
    document.getElementById("canvas");

  const placeholder =
    document.getElementById("placeholder");

  const startCamBtn =
    document.getElementById("startCamBtn");

  const takeSnapBtn =
    document.getElementById("takeSnapBtn");

  const galleryInput =
    document.getElementById("galleryInput");

  const status =
    document.getElementById("status");

  const loading =
    document.getElementById("loading");


  /* =========================================
     State
  ========================================= */

  let selectedMode = "";

  let collectedImages = [];

  let currentStream = null;


  /* =========================================
     Helpers
  ========================================= */

  function setStatus(message, type = "") {

    status.textContent = message;

    status.className = "status";

    if (type) {
      status.classList.add(type);
    }

  }


  function stopCamera() {

    if (currentStream) {

      currentStream
        .getTracks()
        .forEach(track => track.stop());

      currentStream = null;
    }

    video.srcObject = null;

    video.style.display = "none";

    takeSnapBtn.style.display = "none";

    startCamBtn.style.display = "block";

  }


  function showPreview(base64) {

    preview.src = base64;

    preview.style.display = "block";

    video.style.display = "none";

    placeholder.style.display = "none";

  }


  function resetMedia() {

    stopCamera();

    preview.src = "";

    preview.style.display = "none";

    placeholder.style.display = "block";

    galleryInput.value = "";

  }


  function showStep1() {

    stopCamera();

    step1.classList.add("active");

    step2.classList.remove("active");

    progress1.className =
      "progress-step active";

    progress2.className =
      "progress-step";

  }


  function showStep2() {

    step1.classList.remove("active");

    step2.classList.add("active");

    progress1.className =
      "progress-step done";

    progress2.className =
      "progress-step active";

  }


  /* =========================================
     Mode: Sticker
  ========================================= */

  modeStickerBtn.addEventListener("click", () => {

    selectedMode = "sticker";

    collectedImages = [];

    resetMedia();

    showStep2();

    step2Title.textContent =
      "إنشاء ملصق";

    step2Subtitle.textContent =
      "اختر صورة واحدة لتحويلها إلى ملصق";

    setStatus(
      "التقط صورة أو اخترها من المعرض"
    );

  });


  /* =========================================
     Mode: Compare
  ========================================= */

  modeCompareBtn.addEventListener("click", () => {

    selectedMode = "compare";

    collectedImages = [];

    resetMedia();

    showStep2();

    step2Title.textContent =
      "الصورة الأولى";

    step2Subtitle.textContent =
      "اختر الصورة الأولى من الكاميرا أو المعرض";

    setStatus(
      "الصورة الأولى من 2"
    );

  });


  /* =========================================
     Back
  ========================================= */

  backBtn.addEventListener("click", () => {

    collectedImages = [];

    resetMedia();

    showStep1();

    setStatus(
      "اختر العملية المطلوبة"
    );

  });


  /* =========================================
     Camera
  ========================================= */

  startCamBtn.addEventListener(
    "click",
    async () => {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        setStatus(
          "الكاميرا غير مدعومة في هذا المتصفح",
          "error"
        );

        return;
      }


      try {

        currentStream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              },

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }

            }

          });


        video.srcObject =
          currentStream;

        video.style.display =
          "block";

        preview.style.display =
          "none";

        placeholder.style.display =
          "none";

        startCamBtn.style.display =
          "none";

        takeSnapBtn.style.display =
          "block";


        setStatus(
          "وجّه الكاميرا ثم اضغط التقاط الصورة"
        );

      }

      catch (error) {

        console.error(error);

        setStatus(
          "تعذر الوصول إلى الكاميرا. تأكد من السماح باستخدامها.",
          "error"
        );

      }

    }
  );


  /* =========================================
     Take Photo
  ========================================= */

  takeSnapBtn.addEventListener(
    "click",
    () => {

      if (!video.videoWidth) {

        setStatus(
          "انتظر حتى تعمل الكاميرا",
          "error"
        );

        return;
      }


      const originalW =
        video.videoWidth;

      const originalH =
        video.videoHeight;

      const maxDim = 900;


      let width =
        originalW;

      let height =
        originalH;


      if (width > height) {

        if (width > maxDim) {

          height =
            Math.round(
              height *
              (maxDim / width)
            );

          width =
            maxDim;
        }

      }

      else {

        if (height > maxDim) {

          width =
            Math.round(
              width *
              (maxDim / height)
            );

          height =
            maxDim;
        }

      }


      canvas.width =
        width;

      canvas.height =
        height;


      const ctx =
        canvas.getContext("2d");


      ctx.drawImage(
        video,
        0,
        0,
        width,
        height
      );


      const base64 =
        canvas.toDataURL(
          "image/jpeg",
          0.75
        );


      stopCamera();

      showPreview(base64);

      handleImageCaptured(base64);

    }
  );


  /* =========================================
     Gallery
  ========================================= */

  galleryInput.addEventListener(
    "change",
    event => {

      const file =
        event.target.files?.[0];

      if (!file) {
        return;
      }


      if (!file.type.startsWith("image/")) {

        setStatus(
          "الملف المحدد ليس صورة",
          "error"
        );

        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        event => {

          const img =
            new Image();


          img.onload =
            () => {

              const maxDim =
                900;

              let width =
                img.width;

              let height =
                img.height;


              if (width > height) {

                if (width > maxDim) {

                  height =
                    Math.round(
                      height *
                      (maxDim / width)
                    );

                  width =
                    maxDim;
                }

              }

              else {

                if (height > maxDim) {

                  width =
                    Math.round(
                      width *
                      (maxDim / height)
                    );

                  height =
                    maxDim;
                }

              }


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext("2d");


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              const base64 =
                canvas.toDataURL(
                  "image/jpeg",
                  0.75
                );


              showPreview(base64);

              handleImageCaptured(
                base64
              );

            };


          img.onerror =
            () => {

              setStatus(
                "تعذر قراءة الصورة",
                "error"
              );

            };


          img.src =
            event.target.result;

        };


      reader.readAsDataURL(file);

    }
  );


  /* =========================================
     Handle Image
  ========================================= */

  function handleImageCaptured(base64Img) {

    collectedImages.push(base64Img);


    /* -------- Sticker -------- */

    if (
      selectedMode === "sticker"
    ) {

      sendToTelegram({
        action: "sticker",
        images: collectedImages
      });

      return;
    }


    /* -------- Compare -------- */

    if (
      selectedMode === "compare"
    ) {

      if (
        collectedImages.length === 1
      ) {

        step2Title.textContent =
          "الصورة الثانية";

        step2Subtitle.textContent =
          "اختر الصورة الثانية لإكمال المقارنة";

        setStatus(
          "تم اختيار الصورة الأولى ✓ — الصورة الثانية من 2",
          "success"
        );

        resetMedia();

      }


      else if (
        collectedImages.length === 2
      ) {

        sendToTelegram({
          action: "compare",
          images: collectedImages
        });

      }

    }

  }


  /* =========================================
     Send to Telegram
  ========================================= */

  function sendToTelegram(data) {

    loading.style.display =
      "block";

    document.getElementById(
      "captureControls"
    ).style.display = "none";

    setStatus(
      "جاري إرسال الصور..."
    );


    try {

      if (
        tg &&
        typeof tg.sendData === "function"
      ) {

        tg.sendData(
          JSON.stringify(data)
        );

        setTimeout(() => {

          tg.close();

        }, 300);

      }

      else {

        setStatus(
          "يجب فتح التطبيق من داخل Telegram",
          "error"
        );

        loading.style.display =
          "none";

      }

    }

    catch (error) {

      console.error(error);

      loading.style.display =
        "none";

      setStatus(
        "حدث خطأ أثناء إرسال البيانات",
        "error"
      );

    }

  }


  /* =========================================
     Page Cleanup
  ========================================= */

  window.addEventListener(
    "beforeunload",
    () => {

      stopCamera();

    }
  );

</script>

</body>
</html>
