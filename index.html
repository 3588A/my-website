<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التقاط أو اختيار صورة</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #fff;
      padding: 20px;
      box-sizing: border-box;
    }
    video, img {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      display: none;
      margin-bottom: 15px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 300px;
    }
    button, label.upload-btn {
      padding: 14px 20px;
      font-size: 16px;
      background-color: #0088cc;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      font-weight: bold;
    }
    input[type="file"] {
      display: none;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h3>اختر مصدر الصورة</h3>

  <video id="video" autoplay playsinline></video>
  <img id="preview" alt="معاينة الصورة" />

  <div class="btn-group">
    <button id="startCamBtn">📸 فتح الكاميرا المباشرة</button>
    <label for="galleryInput" class="upload-btn">🖼️ اختيار من معرض الصور</label>
    <input type="file" id="galleryInput" accept="image/*">
    <button id="sendBtn" style="display:none; background-color: #2ec4b6;">✅ إرسال ونشر في القناة</button>
  </div>

  <p id="status"></p>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const video = document.getElementById('video');
    const preview = document.getElementById('preview');
    const canvas = document.getElementById('canvas');
    const startCamBtn = document.getElementById('startCamBtn');
    const galleryInput = document.getElementById('galleryInput');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');

    let base64Image = "";

    // 1. طلب إذن فتح الكاميرا
    startCamBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;
        video.style.display = 'block';
        preview.style.display = 'none';
        startCamBtn.style.display = 'none';
        sendBtn.style.display = 'block';
        status.innerText = "اضغط على زر الإرسال لالتقاط ونشر الصورة.";
      } catch (err) {
        alert("تعذر الوصول للكاميرا: " + err);
      }
    });

    // 2. اختيار صورة من تطبيق الصور / معرض الهاتف
    galleryInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          base64Image = event.target.result;
          preview.src = base64Image;
          preview.style.display = 'block';
          video.style.display = 'none';
          sendBtn.style.display = 'block';
          status.innerText = "تمت إضافة الصورة من الصور الخاصة بك. اضغط إرسال للنشر.";
        };
        reader.readAsDataURL(file);
      }
    });

    // 3. إرسال الصورة المختارة إلى سيرفر البوت
    sendBtn.addEventListener('click', () => {
      if (video.style.display === 'block') {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        base64Image = canvas.toDataURL('image/jpeg');
      }

      if (base64Image) {
        status.innerText = "جاري الإرسال...";
        tg.sendData(JSON.stringify({ image: base64Image }));
        tg.close();
      } else {
        alert("يرجى التقاط صورة أو اختيار ملف أولاً.");
      }
    });
  </script>
</body>
</html>
